<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'">
  <meta name="theme-color" content="#fbfaf7">
  <title>Inkwell</title>
  <link rel="manifest" href="/inkwell/manifest.webmanifest">
  <link rel="icon" href="/inkwell/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/inkwell/icons/apple-180.png">
  <link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
  <header>
    <h1>Inkwell</h1>
    <p class="tag">Clean prints. Less toner.</p>
  </header>
  <main id="app">
    <section data-state="empty">
      <button id="choose" class="big">Choose a photo or PDF</button>
      <p class="hint">Or share from Drive → Inkwell</p>
    </section>
    <section data-state="working" hidden>
      <p class="status" id="progress">Getting it ready…</p>
    </section>
    <section data-state="ready" hidden>
      <p class="toner" id="toner"></p>
      <div id="previews"></div>
      <button id="again" class="big quiet">Choose another file</button>
    </section>
    <section data-state="error" hidden>
      <p class="error" id="err-msg"></p>
      <p class="hint" id="err-hint"></p>
      <button id="retry" class="big">Try another file</button>
    </section>
  </main>
  <footer><p id="about"></p></footer>
  <input id="file" type="file" accept="image/*,application/pdf" hidden>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
